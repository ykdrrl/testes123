<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Memori Komplek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Peta Memori Komplek</h1>

  <!-- Kontainer Peta -->
  <div class="map-container">
    <img src="assets/images/map.png" alt="Peta Komplek" class="map-image">

    <!-- Pin / Titik Rumah 1 -->
    <div class="house-pin" style="top: 30%; left: 40%;" onclick="openHouse('rumah1')">
      <span>🏠 Rumah A</span>
    </div>

    <!-- Pin / Titik Rumah 2 -->
    <div class="house-pin" style="top: 55%; left: 70%;" onclick="openHouse('rumah2')">
      <span>🏠 Rumah B</span>
    </div>
  </div>

  <!-- Modal Pop-up Foto & Video -->
  <div id="mediaModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Judul Rumah</h2>
      <div id="modalBody">
        <!-- Foto dan Video akan dimasukkan via JavaScript -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
